<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login · Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
      --border: #2e2e2e; --accent: #c8f96a; --accent2: #f96a6a;
      --text: #f0f0ee; --muted: #888884;
      --font: 'Syne', sans-serif; --mono: 'DM Mono', monospace;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .logo {
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      margin-bottom: 36px; text-align: center;
    }
    .logo span { color: var(--accent); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 400px;
      animation: fadeUp 0.4s ease;
    }
    .card-title {
      font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px;
    }
    .card-sub {
      font-size: 13px; color: var(--muted); margin-bottom: 28px;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block; font-size: 11px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 13px 16px; color: var(--text);
      font-family: var(--mono); font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .error {
      background: rgba(249,106,106,0.1); border: 1px solid rgba(249,106,106,0.3);
      color: var(--accent2); border-radius: 10px; padding: 12px 16px;
      font-size: 13px; margin-bottom: 20px; font-family: var(--mono);
    }
    .btn {
      width: 100%; margin-top: 8px; background: var(--accent); color: #0f0f0f;
      border: none; border-radius: 10px; padding: 14px; font-family: var(--font);
      font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .switch {
      text-align: center; margin-top: 22px; font-size: 13px; color: var(--muted);
    }
    .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .switch a:hover { text-decoration: underline; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="logo">expense<span>.</span>track</div>
  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Log in to your account</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="your username" required autofocus/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn">Log in →</button>
    </form>

    <div class="switch">
      Don't have an account? <a href="/signup">Sign up</a>
    </div>
  </div>
</body>
</html>
